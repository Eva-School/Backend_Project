name: Backend CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GradeManagementSystem.Api.sln
      - run: dotnet build GradeManagementSystem.Api.sln --no-restore --configuration Release
      - run: dotnet restore GradeManagementSystem.Tests/GradeManagementSystem.Tests.csproj
      - run: dotnet test GradeManagementSystem.Tests/GradeManagementSystem.Tests.csproj --no-restore --configuration Release
