# render.yaml – Infrastructure as Code for Render.com
version: "1"

databases:
  - name: grade-postgres-db
    databaseName: neondb
    user: neondb_owner
    plan: free
    region: oregon

services:
  - type: web
    name: grade-management-api
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    branch: dev

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: grade-postgres-db
          property: connectionString

      - key: Jwt__Key
        generateValue: true

      - key: Jwt__Issuer
        value: GradeManagementSystem
      - key: Jwt__Audience
        value: GradeManagementSystemFrontend
      - key: Jwt__DurationInMinutes
        value: "60"
      - key: Jwt__RefreshTokenExpirationDays
        value: "7"

      - key: APPLY_MIGRATIONS
        value: "true"

      - key: RUN_SEED
        value: "false"
