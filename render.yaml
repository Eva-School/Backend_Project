# render.yaml – Infrastructure as Code for Render.com
version: "1"

# Databases are hosted externally on Supabase (Dedicated PostgreSQL)

services:
  - type: web
    name: grade-management-api
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    branch: dev

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ConnectionStrings__DefaultConnection
        sync: false

      - key: Jwt__Key
        generateValue: true

      - key: Jwt__Issuer
        value: GradeManagementSystem
      - key: Jwt__Audience
        value: GradeManagementSystemFrontend
      - key: Jwt__DurationInMinutes
        value: "60"
      - key: Jwt__RefreshTokenExpirationDays
        value: "7"

      - key: APPLY_MIGRATIONS
        value: "true"

      - key: RUN_SEED
        value: "false"

      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"

      - key: ADMIN_USERNAME
        value: "admin"

      - key: ADMIN_PASSWORD
        generateValue: true

      - key: ADMIN_EMAIL
        value: "admin@system.com"
